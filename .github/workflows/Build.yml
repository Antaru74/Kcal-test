name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']          # tag v* (mis. v2.0) otomatis membuat GitHub Release berisi APK
  pull_request:
  workflow_dispatch:      # tombol "Run workflow" manual

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write         # hanya dipakai langkah Release (tag v*); selain itu cukup read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_VERSION: '8.7'   # sesuai gradle-wrapper.properties; AGP 8.5.2 butuh minimal 8.7
      # true bila secret keystore sudah dibuat (lihat langkah "Tanda tangani dengan keystore sendiri")
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Repo bisa berisi proyek yang sudah diekstrak ATAU hanya kcal-module.zip.
      # Langkah ini mencari settings.gradle; kalau tidak ada, zip di root repo diekstrak dulu.
      - name: Cari proyek (ekstrak zip bila perlu)
        id: proj
        run: |
          set -euo pipefail
          find_settings() {
            find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path './.git/*' | head -n1
          }
          s="$(find_settings || true)"
          if [ -z "$s" ]; then
            shopt -s nullglob
            zips=(./*.zip)
            if [ "${#zips[@]}" -eq 0 ]; then
              echo "::error::Tidak ada settings.gradle dan tidak ada file .zip di root repo"
              exit 1
            fi
            echo "Mengekstrak ${zips[0]}"
            unzip -q -o "${zips[0]}" -d .
            s="$(find_settings || true)"
            if [ -z "$s" ]; then
              echo "::error::settings.gradle tidak ditemukan setelah mengekstrak ${zips[0]}"
              exit 1
            fi
          fi
          dir="$(dirname "$s")"
          echo "Proyek ditemukan di: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Proyek tidak menyertakan gradlew, jadi pasang Gradle yang versinya pasti.
      - name: Pasang Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build (assembleRelease)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle --version
          gradle assembleRelease --stacktrace

      - name: Kemas APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -euo pipefail
          apk="$(find . -path '*/build/outputs/apk/release/*.apk' | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::APK release tidak ditemukan"
            exit 1
          fi
          ver="$(grep -oP "versionName\s+['\"]\K[^'\"]+" app/build.gradle || echo dev)"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/KcalModule-v${ver}-${GITHUB_SHA::7}.apk"
          ls -l "$GITHUB_WORKSPACE/dist"

      # OPSIONAL. Tanpa ini, tiap build ditandatangani debug key baru (acak per run), sehingga
      # APK dari run berbeda tidak bisa saling meng-update (harus uninstall dulu).
      # Isi secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Tanda tangani dengan keystore sendiri
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt="$(ls -d "$sdk"/build-tools/* | sort -V | tail -n1)"
          for f in dist/*.apk; do
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD "$f"
            "$bt/apksigner" verify --print-certs "$f" | head -n 3
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Ringkasan
        run: |
          {
            echo "### APK"
            for f in dist/*.apk; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1), sha256 \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: KcalModule-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
